services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-streetfood_app}
      DB_PASSWORD: ${DB_PASSWORD:-streetfood_app_password}
      DB_NAME: ${DB_NAME:-db_streetfood}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health.php') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-db_streetfood}
      MYSQL_USER: ${DB_USER:-streetfood_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-streetfood_app_password}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql
      - ./database/db_streetfood.sql:/docker-entrypoint-initdb.d/db_streetfood.sql:ro

volumes:
  db_data:
